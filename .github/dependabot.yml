version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/create-starter
      - /templates/wordpress
      - /templates/vite
      - /templates/astro
      - /templates/webapp
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 型は実行する Node（shared/.mise.toml）のメジャー版に合わせる。Node を上げるときに一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
