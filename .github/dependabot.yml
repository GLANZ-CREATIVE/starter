version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/create-starter
      - /templates/wordpress
      - /templates/vite
      - /templates/astro
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
